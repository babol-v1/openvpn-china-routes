name: Generate Routes List

# 定义触发条件
on:
  schedule:
    # 定时任务：每月 1 号凌晨 0:00 (UTC 时间) 自动运行
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # 允许你在 GitHub 网页上手动点击按钮立即运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 签出（下载）你仓库的代码到 GitHub 的虚拟服务器上
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. 安装并配置 Python 3 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. 运行你的 python 脚本生成 routes.txt
    - name: Run chnroutes script
      run: |
        if [ -f chnroutes.py ]; then
          python chnroutes.py
        else
          echo "错误：未在仓库根目录下找到 chnroutes.py 文件！"
          exit 1
        fi

    # 4. 自动把新生成的 routes.txt 提交并上传（Push）回你的 GitHub 仓库
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # 检查文件是否有变动，有变动则提交
        git add routes.txt
        if git diff --staged --quiet; then
          echo "路由表没有变化，无需更新。"
        else
          git commit -m "自动更新: 重新生成最新的全量中国大陆路由表"
          git push
        fi
